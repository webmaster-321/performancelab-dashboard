<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Lab — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --surface2: #F0EEE9;
    --border: #E4E1D9;
    --text: #1A1917;
    --text2: #6B6860;
    --text3: #A09D96;
    --blue: #2563EB;
    --blue-bg: #EFF4FF;
    --green: #16A34A;
    --green-bg: #F0FDF4;
    --amber: #D97706;
    --amber-bg: #FFFBEB;
    --red: #DC2626;
    --red-bg: #FEF2F2;
    --teal: #0D9488;
    --teal-bg: #F0FDFA;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* HEADER */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 1rem; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-dot { width: 28px; height: 28px; background: var(--blue); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-dot svg { width: 16px; height: 16px; fill: white; }
  .logo-name { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
  .logo-sub { font-size: 12px; color: var(--text3); font-weight: 300; }
  .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .status-pill { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 5px 10px; border-radius: 20px; background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); }
  .status-pill.ok .status-dot { background: var(--green); }
  .status-pill.err .status-dot { background: var(--red); }

  /* CONTROLS BAR */
  .controls-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; }
  .controls-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 12px; height: 52px; flex-wrap: wrap; }
  .range-group { display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .btn-range { padding: 5px 14px; font-size: 12px; font-family: 'DM Sans', sans-serif; background: transparent; border: none; cursor: pointer; color: var(--text2); transition: all 0.15s; font-weight: 400; }
  .btn-range:not(:last-child) { border-right: 1px solid var(--border); }
  .btn-range.active { background: var(--text); color: white; font-weight: 500; }
  .date-sep { font-size: 12px; color: var(--text3); }
  .date-input { font-size: 12px; font-family: 'DM Sans', sans-serif; padding: 5px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); cursor: pointer; }
  .date-range-label { font-size: 12px; color: var(--text2); margin-left: auto; }
  .btn-refresh { padding: 5px 14px; font-size: 12px; font-family: 'DM Sans', sans-serif; background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; color: var(--text2); display: flex; align-items: center; gap: 6px; transition: all 0.15s; }
  .btn-refresh:hover { background: var(--surface2); }

  /* MAIN */
  .main { max-width: 1280px; margin: 0 auto; padding: 2rem; }

  /* SECTION */
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .section-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; cursor: pointer; user-select: none; transition: background 0.15s; }
  .section-header:hover { background: var(--surface2); }
  .section-header-left { display: flex; align-items: center; gap: 10px; }
  .section-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .section-title { font-size: 14px; font-weight: 500; }
  .section-summary { font-size: 12px; color: var(--text2); margin-left: 4px; }
  .section-chevron { color: var(--text3); font-size: 12px; transition: transform 0.2s; }
  .section-chevron.open { transform: rotate(180deg); }
  .section-body { padding: 0 1.25rem 1.25rem; border-top: 1px solid var(--border); }
  .section-body.collapsed { display: none; }

  /* CARDS GRID */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; padding-top: 1.25rem; }
  .card { background: var(--surface2); border-radius: var(--radius-sm); padding: 1rem; }
  .card-label { font-size: 11px; color: var(--text2); margin-bottom: 8px; font-weight: 400; }
  .card-value { font-size: 24px; font-weight: 500; color: var(--text); letter-spacing: -0.02em; font-family: 'DM Mono', monospace; }
  .card-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .card.accent-blue { background: var(--blue-bg); }
  .card.accent-blue .card-value { color: var(--blue); }
  .card.accent-green { background: var(--green-bg); }
  .card.accent-green .card-value { color: var(--green); }
  .card.accent-amber { background: var(--amber-bg); }
  .card.accent-amber .card-value { color: var(--amber); }
  .card.accent-teal { background: var(--teal-bg); }
  .card.accent-teal .card-value { color: var(--teal); }
  .card.accent-red { background: var(--red-bg); }
  .card.accent-red .card-value { color: var(--red); }

  /* CHARTS */
  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 1.25rem; }
  .chart-card { background: var(--surface2); border-radius: var(--radius-sm); padding: 1rem; }
  .chart-card-title { font-size: 12px; color: var(--text2); margin-bottom: 12px; font-weight: 400; }
  .chart-wrap { position: relative; width: 100%; height: 180px; }

  /* SUMMARY ROW */
  .summary-row { display: flex; gap: 2rem; padding: 1.25rem 0 0; flex-wrap: wrap; }
  .summary-item { display: flex; flex-direction: column; gap: 2px; }
  .summary-label { font-size: 11px; color: var(--text3); }
  .summary-val { font-size: 13px; font-weight: 500; font-family: 'DM Mono', monospace; }

  /* ERROR */
  .error-box { background: var(--red-bg); border: 1px solid #FCA5A5; border-radius: var(--radius-sm); padding: 1rem 1.25rem; color: var(--red); font-size: 13px; line-height: 1.8; margin: 1rem 0; }

  /* LOADING */
  .loading { text-align: center; padding: 4rem 2rem; color: var(--text3); font-size: 14px; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media(max-width: 768px) {
    .main { padding: 1rem; }
    .charts-row { grid-template-columns: 1fr; }
    .header { padding: 0 1rem; }
    .controls-bar { padding: 0 1rem; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-dot">
        <svg viewBox="0 0 16 16"><path d="M8 2L14 5V11L8 14L2 11V5L8 2Z"/></svg>
      </div>
      <div>
        <div class="logo-name">Performance Lab</div>
        <div class="logo-sub">Dashboard de métricas</div>
      </div>
    </div>
    <div class="header-right">
      <div class="status-pill" id="status-pill">
        <div class="status-dot"></div>
        <span id="status-text">Conectando...</span>
      </div>
    </div>
  </div>
</div>

<div class="controls-bar">
  <div class="controls-inner">
    <div class="range-group">
      <button class="btn-range" data-range="7">7D</button>
      <button class="btn-range" data-range="14">14D</button>
      <button class="btn-range" data-range="30">30D</button>
      <button class="btn-range active" data-range="all">Todo</button>
    </div>
    <input type="date" class="date-input" id="date-from">
    <span class="date-sep">→</span>
    <input type="date" class="date-input" id="date-to">
    <button class="btn-refresh" onclick="loadData()">↻ Actualizar</button>
    <span class="date-range-label" id="range-label"></span>
  </div>
</div>

<div class="main" id="main-content">
  <div class="loading">
    <div class="spinner"></div>
    Cargando datos desde Google Sheets...
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/a/macros/laweb.pe/s/AKfycbxREPcUQgTokMJtqM63BvdQzY__h4FYnS4oXA_vI9CEdQetlyXtgG3JPqhPpMQ1p2cY/exec';
let allRows = [];
let charts = {};

function fmt$(n){ return '$'+(parseFloat(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtPct(n){ return ((parseFloat(n)||0)*100).toFixed(2)+'%'; }
function fmtN(n){ return Math.round(n||0).toLocaleString('en-US'); }

function parseDate(s){
  if(!s) return null;
  const str = String(s).trim();
  if(!str) return null;
  const dmy = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(dmy) return new Date(+dmy[3], +dmy[2]-1, +dmy[1]);
  const iso = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(iso) return new Date(+iso[1], +iso[2]-1, +iso[3]);
  const d = new Date(str);
  return isNaN(d.getTime())?null:d;
}
function parseNum(s){ return parseFloat(String(s||0).replace(/[$, ]/g,''))||0; }

async function loadData(){
  setStatus('Cargando...','');
  try {
    const res = await fetch(API_URL);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    allRows = json.map(row => ({
      fecha: parseDate(row['Fecha']),
      monto: parseNum(row['Monto']),
      evento: String(row['Evento']||'').trim(),
      tipoPlan: String(row['Tipo de Plan']||'').trim(),
      mrrNeto: parseNum(row['MRR neto']),
      expMrr: parseNum(row['Expansión MRR neta']),
      motivoCancelacion: String(row['Motivo Cancelación']||'').trim(),
    })).filter(r=>r.fecha&&!isNaN(r.fecha.getTime()));

    if(!allRows.length) throw new Error('Sin filas válidas');
    setStatus(allRows.length+' registros','ok');
    initDatePickers();
    renderAll(allRows);
  } catch(e){
    setStatus('Error de conexión','err');
    document.getElementById('main-content').innerHTML = `
      <div class="error-box">
        <strong>No se pudo conectar con Google Sheets.</strong><br><br>
        Verificá que el Apps Script esté publicado correctamente:<br>
        — Implementar → Gestionar implementaciones → El acceso es "Cualquier persona"<br><br>
        Error: ${e.message}
      </div>`;
  }
}

function setStatus(text, cls){
  const pill = document.getElementById('status-pill');
  const span = document.getElementById('status-text');
  pill.className = 'status-pill '+(cls||'');
  span.textContent = text;
}

function initDatePickers(){
  const times = allRows.map(r=>r.fecha.getTime());
  const minD = new Date(Math.min(...times));
  const maxD = new Date(Math.max(...times));
  const df = document.getElementById('date-from');
  const dt = document.getElementById('date-to');
  df.value = minD.toISOString().split('T')[0];
  dt.value = maxD.toISOString().split('T')[0];
  df.addEventListener('change', applyFilter);
  dt.addEventListener('change', applyFilter);
}

function applyFilter(){
  const f = new Date(document.getElementById('date-from').value+'T00:00:00');
  const t = new Date(document.getElementById('date-to').value+'T23:59:59');
  const filtered = allRows.filter(r=>r.fecha>=f&&r.fecha<=t);
  renderAll(filtered);
  const label = f.toLocaleDateString('es-AR',{day:'numeric',month:'short'})+' → '+t.toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'});
  document.getElementById('range-label').textContent = label;
}

function setRange(days){
  document.querySelectorAll('.btn-range').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  const times = allRows.map(r=>r.fecha.getTime());
  const maxD = new Date(Math.max(...times));
  const dt = document.getElementById('date-to');
  const df = document.getElementById('date-from');
  dt.value = maxD.toISOString().split('T')[0];
  if(days==='all'){
    df.value = new Date(Math.min(...times)).toISOString().split('T')[0];
  } else {
    const f = new Date(maxD); f.setDate(f.getDate()-parseInt(days)+1);
    df.value = f.toISOString().split('T')[0];
  }
  applyFilter();
}

function calc(rows){
  const nuevos = rows.filter(r=>r.evento==='Nuevo');
  const cancelaciones = rows.filter(r=>r.evento==='Cancelación'&&r.motivoCancelacion==='Churn');
  const reembolsos = rows.filter(r=>r.evento==='Cancelación'&&r.motivoCancelacion==='Reembolso');
  const upsells = rows.filter(r=>r.evento==='Upsell');
  const otos = rows.filter(r=>r.evento==='OTO');

  const newMrr = nuevos.reduce((s,r)=>s+r.mrrNeto,0)-reembolsos.reduce((s,r)=>s+r.mrrNeto,0);
  const expMrr = upsells.reduce((s,r)=>s+r.expMrr,0);
  const churnMrr = cancelaciones.reduce((s,r)=>s+r.mrrNeto,0);
  const netMrr = newMrr+expMrr-churnMrr;
  const activas = Math.max(0,nuevos.length-reembolsos.length-cancelaciones.length);
  const churnRate = nuevos.length>0?cancelaciones.length/nuevos.length:0;
  const refundRate = nuevos.length>0?reembolsos.length/nuevos.length:0;
  const upgradeRate = nuevos.length>0?upsells.length/nuevos.length:0;
  const nrr = (nuevos.length*29)>0?netMrr/(nuevos.length*29):0;
  const otoCount = otos.length;
  const otoRev = otos.reduce((s,r)=>s+r.monto,0);
  const aovOto = otoCount>0?otoRev/otoCount:0;
  const otoRate = nuevos.length>0?otoCount/nuevos.length:0;
  const revSub = newMrr+expMrr;
  const revTotal = revSub+otoRev;
  const arr = newMrr*12;
  const arpuTotal = activas>0?revTotal/activas:0;
  const mensualRows = nuevos.filter(r=>r.tipoPlan==='Mensual');
  const anualRows = upsells.filter(r=>r.tipoPlan==='Anual');
  const arpuM = mensualRows.length>0?mensualRows.reduce((s,r)=>s+r.mrrNeto,0)/mensualRows.length:0;
  const arpuA = anualRows.length>0?anualRows.reduce((s,r)=>s+r.mrrNeto,0)/anualRows.length:0;
  const ltv = churnRate>0?29/churnRate:580;
  const cac = 22.30;
  return { nuevos,cancelaciones,reembolsos,upsells,otos,newMrr,expMrr,churnMrr,netMrr,activas,churnRate,refundRate,upgradeRate,nrr,otoCount,otoRev,aovOto,otoRate,revSub,revTotal,arr,arpuTotal,arpuM,arpuA,ltv,cac,ltvCac:cac>0?ltv/cac:0,payback:arpuTotal>0?cac/arpuTotal:0,rows };
}

function renderAll(rows){
  const d = calc(rows);
  const html = `
    ${section('subs','#EFF4FF','📋','Suscripciones',
      `<span class="section-summary">${fmtN(d.activas)} activas · ${fmtN(d.nuevos.length)} nuevas</span>`,
      `<div class="cards">
        <div class="card accent-blue"><div class="card-label">Suscripciones activas</div><div class="card-value">${fmtN(d.activas)}</div></div>
        <div class="card"><div class="card-label">Nuevas suscripciones</div><div class="card-value">${fmtN(d.nuevos.length)}</div></div>
        <div class="card"><div class="card-label">Cancelaciones (churn)</div><div class="card-value">${fmtN(d.cancelaciones.length)}</div></div>
        <div class="card"><div class="card-label">Reembolsos</div><div class="card-value">${fmtN(d.reembolsos.length)}</div></div>
        <div class="card"><div class="card-label">Upsells anuales</div><div class="card-value">${fmtN(d.upsells.length)}</div></div>
      </div>
      ${chartSection('chart-subs-day','Nuevas suscripciones por día')}`, true)}

    ${section('mrr','#F0FDF4','💰','MRR',
      `<span class="section-summary">New ${fmt$(d.newMrr)} · Net ${fmt$(d.netMrr)}</span>`,
      `<div class="cards">
        <div class="card accent-green"><div class="card-label">New MRR</div><div class="card-value">${fmt$(d.newMrr)}</div></div>
        <div class="card"><div class="card-label">Expansion MRR</div><div class="card-value">${fmt$(d.expMrr)}</div></div>
        <div class="card accent-red"><div class="card-label">Churned MRR</div><div class="card-value">${fmt$(d.churnMrr)}</div></div>
        <div class="card accent-blue"><div class="card-label">Net New MRR</div><div class="card-value">${fmt$(d.netMrr)}</div></div>
        <div class="card"><div class="card-label">ARR</div><div class="card-value">${fmt$(d.arr)}</div></div>
      </div>
      ${chartSection('chart-mrr-cum','Ingreso acumulado')}`, true)}

    ${section('ret','#FFFBEB','🔄','Retención',
      `<span class="section-summary">Churn ${fmtPct(d.churnRate)} · NRR ${fmtPct(d.nrr)}</span>`,
      `<div class="cards">
        <div class="card ${d.churnRate>0.1?'accent-red':'accent-green'}"><div class="card-label">Churn Rate</div><div class="card-value">${fmtPct(d.churnRate)}</div></div>
        <div class="card"><div class="card-label">Reembolso Rate</div><div class="card-value">${fmtPct(d.refundRate)}</div></div>
        <div class="card accent-teal"><div class="card-label">Annual Upgrade Rate</div><div class="card-value">${fmtPct(d.upgradeRate)}</div></div>
        <div class="card ${d.nrr>=1?'accent-green':'accent-amber'}"><div class="card-label">Net Revenue Retention</div><div class="card-value">${fmtPct(d.nrr)}</div></div>
      </div>`, false)}

    ${section('oto','#F0FDFA','🎯','Curso CRO',
      `<span class="section-summary">${fmtN(d.otoCount)} compras · ${fmtPct(d.otoRate)} attach rate</span>`,
      `<div class="cards">
        <div class="card accent-teal"><div class="card-label">Compras OTO</div><div class="card-value">${fmtN(d.otoCount)}</div></div>
        <div class="card accent-teal"><div class="card-label">OTO Attach Rate</div><div class="card-value">${fmtPct(d.otoRate)}</div></div>
        <div class="card"><div class="card-label">AOV OTO</div><div class="card-value">${fmt$(d.aovOto)}</div></div>
        <div class="card accent-green"><div class="card-label">Ingreso OTO</div><div class="card-value">${fmt$(d.otoRev)}</div></div>
      </div>
      ${chartSection('chart-oto-rate','OTO Attach Rate por día')}`, false)}

    ${section('unit','#EFF4FF','📊','Unit Economics',
      `<span class="section-summary">LTV ${fmt$(d.ltv)} · LTV:CAC ${d.ltvCac.toFixed(1)}x</span>`,
      `<div class="cards">
        <div class="card"><div class="card-label">ARPU Total</div><div class="card-value">${fmt$(d.arpuTotal)}</div></div>
        <div class="card"><div class="card-label">ARPU Mensual</div><div class="card-value">${fmt$(d.arpuM)}</div></div>
        <div class="card"><div class="card-label">ARPU Anual</div><div class="card-value">${fmt$(d.arpuA)}</div></div>
        <div class="card accent-blue"><div class="card-label">LTV</div><div class="card-value">${fmt$(d.ltv)}</div><div class="card-sub">${d.churnRate===0?'estimado al 5% churn':''}</div></div>
        <div class="card"><div class="card-label">CAC</div><div class="card-value">${fmt$(d.cac)}</div><div class="card-sub">ingresado manualmente</div></div>
        <div class="card accent-green"><div class="card-label">LTV:CAC</div><div class="card-value">${d.ltvCac.toFixed(1)}x</div></div>
        <div class="card accent-amber"><div class="card-label">Payback Period</div><div class="card-value">${d.payback.toFixed(1)}</div><div class="card-sub">meses</div></div>
      </div>`, false)}
  `;
  document.getElementById('main-content').innerHTML = html;
  setupSections();
  renderCharts(rows, d);
}

function section(id, iconBg, icon, title, summary, body, open){
  return `<div class="section" id="sec-${id}">
    <div class="section-header" onclick="toggleSection('${id}')">
      <div class="section-header-left">
        <div class="section-icon" style="background:${iconBg}">${icon}</div>
        <span class="section-title">${title}</span>
        ${summary}
      </div>
      <span class="section-chevron ${open?'open':''}" id="chev-${id}">▼</span>
    </div>
    <div class="section-body ${open?'':'collapsed'}" id="body-${id}">${body}</div>
  </div>`;
}

function chartSection(id, title){
  return `<div class="charts-row"><div class="chart-card" style="grid-column:1/-1">
    <div class="chart-card-title">${title}</div>
    <div class="chart-wrap"><canvas id="${id}"></canvas></div>
  </div></div>`;
}

function toggleSection(id){
  const body = document.getElementById('body-'+id);
  const chev = document.getElementById('chev-'+id);
  body.classList.toggle('collapsed');
  chev.classList.toggle('open');
}

function setupSections(){}

function renderCharts(rows, d){
  const byDay={};
  rows.forEach(r=>{
    const day = r.fecha.toISOString().split('T')[0];
    if(!byDay[day]) byDay[day]={nuevo:0,oto:0,rev:0};
    if(r.evento==='Nuevo') byDay[day].nuevo++;
    if(r.evento==='OTO') byDay[day].oto++;
    byDay[day].rev+=r.monto;
  });
  const days=Object.keys(byDay).sort();
  const subsData=days.map(d=>byDay[d].nuevo);
  let cum=0; const revData=days.map(d=>{cum+=byDay[d].rev;return+cum.toFixed(2);});
  const otoData=days.map(d=>byDay[d].nuevo>0?+((byDay[d].oto/byDay[d].nuevo)*100).toFixed(1):0);

  const BLUE='#2563EB'; const TEAL='#0D9488'; const AMBER='#D97706';

  function mk(id,cfg){
    if(charts[id]) charts[id].destroy();
    const el=document.getElementById(id);
    if(el) charts[id]=new Chart(el,cfg);
  }

  const baseOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:10,font:{size:10},color:'#A09D96'},grid:{display:false}},y:{ticks:{font:{size:10},color:'#A09D96'},grid:{color:'#F0EEE9'}}}};

  mk('chart-subs-day',{type:'bar',data:{labels:days,datasets:[{data:subsData,backgroundColor:BLUE+'33',borderColor:BLUE,borderWidth:1.5,borderRadius:4}]},options:{...baseOpts,scales:{...baseOpts.scales,y:{...baseOpts.scales.y,ticks:{...baseOpts.scales.y.ticks,stepSize:1}}}}});
  mk('chart-mrr-cum',{type:'line',data:{labels:days,datasets:[{data:revData,borderColor:TEAL,backgroundColor:TEAL+'22',fill:true,tension:0.4,pointRadius:0,borderWidth:2}]},options:{...baseOpts,scales:{...baseOpts.scales,y:{...baseOpts.scales.y,ticks:{...baseOpts.scales.y.ticks,callback:v=>'$'+v.toLocaleString('en-US')}}}}});
  mk('chart-oto-rate',{type:'line',data:{labels:days,datasets:[{data:otoData,borderColor:AMBER,backgroundColor:AMBER+'22',fill:true,tension:0.4,pointRadius:0,borderWidth:2}]},options:{...baseOpts,scales:{...baseOpts.scales,y:{...baseOpts.scales.y,ticks:{...baseOpts.scales.y.ticks,callback:v=>v+'%'}}}}});
}

document.querySelectorAll('.btn-range').forEach(btn=>{
  btn.addEventListener('click', function(){ setRange(this.dataset.range); });
});

loadData();
</script>
</body>
</html>
